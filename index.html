<script>
"use strict";
// Life Tracker, version 2: workout hub, per-workout pages, calendar.
// ---------- Helpers ----------
const KEY = "lifetracker:v1";
const pad = n => String(n).padStart(2, "0");
const dstr = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => dstr(new Date());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return dstr(d); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const usd = n => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(n);

// Tiny helper to build HTML elements safely: h("div", {class:"x"}, "text", childElement)
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (v != null && v !== false) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}

// ---------- Saved data ----------
// Everything lives in one object: { v: 1, data: { workouts: [...], skills: [...], ... } }
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.data) return s; } catch (e) {}
  return { v: 1, data: {} };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { alert("Could not save. Your browser storage may be full or blocked."); }
}
let state = load();
const list = id => state.data[id] || (state.data[id] = []);

// ---------- The sections ----------
// To add a new section later: copy one block below, change the id, title and fields.
// It then gets its own tab, form, list and backup support automatically
// (no other changes needed).
const STATUS = ["Want to try", "Training", "Achieved"];
const MODULES = [
  {
    id: "workouts", title: "Custom", noun: "custom workout",
    empty: "No custom workouts yet. Add one to log anything outside Workouts 1 to 3.",
    fields: [
      { k: "date", l: "Date", t: "date", def: () => viewDate },
      { k: "name", l: "Workout", t: "text", ph: "Push day", req: 1 },
      { k: "minutes", l: "Minutes", t: "number", min: 0 },
      { k: "notes", l: "Notes", t: "textarea", ph: "Exercises, sets, reps" }
    ],
    head: e => e.name,
    meta: e => [e.date, e.minutes != null && e.minutes + " min"],
    summary: es => { const c = es.filter(e => e.date >= daysAgo(6)).length; return c + (c === 1 ? " custom workout" : " custom workouts") + " in the last 7 days"; }
  },
  {

function addForm(m) {
  const f = h("form");
  m.fields.forEach(fl => {
    let inp;
    if (fl.t === "textarea") inp = h("textarea", { name: fl.k, rows: 3, placeholder: fl.ph });
    else if (fl.t === "select") inp = h("select", { name: fl.k }, fl.opts.map(o => h("option", { value: o }, o)));
    else inp = h("input", { name: fl.k, type: fl.t, placeholder: fl.ph, required: fl.req, min: fl.min, max: fl.max,
      inputmode: fl.t === "number" ? "decimal" : null, step: fl.t === "number" ? "any" : null });
    const def = typeof fl.def === "function" ? fl.def() : fl.def;
    if (def != null) inp.value = def;
    f.append(h("label", {}, h("span", {}, fl.l), inp));
  });
  f.append(h("button", { class: "btn", type: "submit" }, "Save " + m.noun));
  f.addEventListener("submit", ev => {
    ev.preventDefault();
    const e = { id: uid(), at: new Date().toISOString() };
    const fd = new FormData(f);
    m.fields.forEach(fl => {
      const v = (fd.get(fl.k) || "").trim();
      if (v === "") return;
      e[fl.k] = fl.t === "number" ? Number(v) : v;
    });
    list(m.id).unshift(e);
    save(); render();
  });
  return f;
}

function card(m, e) {
  const meta = m.meta(e).filter(Boolean).join(", ");
  return h("div", { class: "card" },

}

function moduleView(m) {

}

// ---------- Backup: export and import ----------
async function exportData() {
  const prev = [state.lastExport, state.backupCount];
  state.lastExport = today(); state.backupCount = (state.backupCount || 0) + 1;
  save();
  const name = "life-tracker-backup-" + today() + ".json";
  const file = new File([JSON.stringify(state, null, 2)], name, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); render(); return; }
    catch (e) { if (e.name === "AbortError") { [state.lastExport, state.backupCount] = prev; save(); render(); return; } }
  }
  const a = h("a", { href: URL.createObjectURL(file), download: name });
  document.body.append(a); a.click(); a.remove(); render();
}

// In-app confirm / notice (browser pop-up boxes are blocked in some views). fn = null makes a plain notice.
function askConfirm(text, label, fn, back, no) { modal = { type: "confirm", text, label, fn, back, no }; render(); }
function confirmModal(m) {
  const go = () => { modal = null; if (m.fn) m.fn(); else render(); };
  return h("div", {},
    m.text && h("p", { class: "askt" }, m.text),
    h("div", { class: "askb" },
      m.fn && h("button", { class: "btn alt", onclick: () => { modal = m.back || null; suppressClick = false; renderModal(); } }, m.no || "Cancel"),
      h("button", { class: "btn" + (m.fn && !m.no ? " warn" : ""), onclick: go }, m.label || "OK")));
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const s = JSON.parse(r.result);
      if (!s || typeof s.data !== "object" || Array.isArray(s.data) || !Object.values(s.data).every(v => Array.isArray(v) || (v && typeof v === "object"))) throw new Error("bad");
      askConfirm("This replaces everything on this device with the backup. Continue?", "Restore", () => {
        state = { v: 1, data: s.data, lastExport: s.lastExport, backupCount: s.backupCount, seeded: 1, ptSeeded: 1, checkSync: s.checkSync };
        save(); syncChecksOnce(); caliMigrate(); askConfirm("Backup restored.", "OK", null);
      });
    } catch (e) { askConfirm("That file is not a valid Life Tracker backup.", "OK", null); }
  };
  r.readAsText(file);
}

function backupView() {

    h("div", { class: "card gcard" }, h("div", { class: "mh" }, h("h2", {}, "Export"), infoBtn("export")),

    h("button", { class: "btn alt", onclick: () => picker.click() }, "Import backup"),
    hasDemo() && h("button", { class: "btn alt", onclick: removeDemo }, "Remove sample data"),
    picker);
}

// Three records per exercise. Saved keys stay rm1 / rm5 / rm10 so old data keeps working:
//   rm1  = heaviest weight you have lifted at any rep count (4 reps at a weight above your 1 rep max raises it too)
//   rm5  = heaviest weight you got 5 sets of 5+ reps with in one day (5 x 5)
//   rm10 = heaviest weight you got 3 sets of 10+ reps with in one day (3 x 10)
const MAXES = [["rm1", "1 rep max"], ["rm5", "5 × 5"], ["rm10", "3 × 10"]];
const GROUPS = { rm1: [1, 0, 99], rm5: [5, 5, 99], rm10: [3, 10, 99] }; // [sets needed, min reps, max reps]
// Best result for one record from a list of sets: the weight you reached at least `n` times within the rep range.
function bestFor(k, sets) {
  const [n, lo, hi] = GROUPS[k];
  const w = sets.filter(x => x.weight && (x.reps || 1) >= lo && (x.reps || 1) <= hi).map(x => x.weight).sort((a, b) => b - a);
  return w.length >= n ? w[n - 1] : 0;
}

// Saved data for this section:
//   sessions: { date, w, sets: [{ ex, weight, reps }] }   the sets you log
//   maxes:    { ex, rm10, rm5, rm1 }                      the maxes shown on each exercise
//   checks:   { date, w }                                 "worked out" marks, which drive the calendar and weekly bar
const SEED_MAXES = { bench: [155, 175, 200], triceps: [55, 60, 70], shoulders: [150, 170, 185] };
const isChecked = (w, date) => list("checks").some(c => c.w === w && c.date === date);
function getMax(ex) { return list("maxes").find(m => m.ex === ex) || {}; }
// Logging sets raises a record when that day's sets beat it.
function bumpMaxes(ex, date) {
  const day = daySets(ex, date);
  let m = list("maxes").find(x => x.ex === ex);
  for (const k of Object.keys(GROUPS)) {
    const v = bestFor(k, day);
    if (v > ((m && m[k]) || 0)) {
      if (!m) { m = { ex }; list("maxes").push(m); }
      m[k] = v;
    }
  }
}
function addSet(w, date, ex, weight, reps, count) {
  let s = list("sessions").find(x => x.w === w && x.date === date);
  if (!s) { s = { id: uid(), at: new Date().toISOString(), date, w, sets: [] }; list("sessions").push(s); }
  delete s.demo;
  for (let i = 0; i < (count || 1); i++) s.sets.push({ ex, weight, reps });
  bumpMaxes(ex, date);
  const ck = list("checks").find(c => c.w === w && c.date === date);
  if (ck) delete ck.demo; else list("checks").push({ id: uid(), at: new Date().toISOString(), date, w });
  save(); render();
}
function delSet(s, idx) {
  [...idx].sort((a, b) => b - a).forEach(i => s.sets.splice(i, 1));
  if (!s.sets.length) state.data.sessions = list("sessions").filter(x => x !== s);
  save(); render();
}
function toggleCheck(date, w) {
  state.data.checks = isChecked(w, date) ? list("checks").filter(c => !(c.date === date && c.w === w))
    : [...list("checks"), { id: uid(), at: new Date().toISOString(), date, w }];
  save(); render();
}

// ---------- Sample data (first run only) ----------
// Sets your starting maxes and adds a week of example workouts, tagged so one button can remove them.
function seedOnce() {
  if (state.seeded) return;
  state.seeded = 1;
  for (const [ex, [a, b, c]] of Object.entries(SEED_MAXES)) {
    let m = list("maxes").find(x => x.ex === ex);
    if (!m) { m = { ex }; list("maxes").push(m); }
    m.rm10 = a; m.rm5 = b; m.rm1 = c;
  }
  const S = (ex, rows) => rows.map(([weight, reps]) => ({ ex, weight, reps }));
  const mk = (ago, sets) => ({ id: uid(), at: new Date().toISOString(), date: daysAgo(ago), w: "w1", demo: true, sets });
  list("sessions").push(
    mk(6, [...S("bench", [[135, 10], [135, 10], [140, 8]]), ...S("triceps", [[40, 12], [40, 10]]), ...S("shoulders", [[120, 10], [120, 8]])]),
    mk(4, [...S("bench", [[140, 10], [145, 8], [145, 8]]), ...S("triceps", [[45, 10], [45, 10]]), ...S("shoulders", [[125, 10], [125, 8]])]),
    mk(2, [...S("bench", [[145, 10], [150, 8], [150, 6]]), ...S("triceps", [[50, 10], [50, 8]]), ...S("shoulders", [[130, 10], [130, 8]])]));
  [[5, "w2"], [3, "w3"], [1, "w2"]].forEach(([ago, w]) =>
    list("checks").push({ id: uid(), at: new Date().toISOString(), date: daysAgo(ago), w, demo: true }));
  save();
}
// One time: make sure every day with logged sets also has its check, so the calendar has one source of truth.
function syncChecksOnce() {
  if (state.checkSync) return;
  state.checkSync = 1;
  list("sessions").forEach(s => {
    if (!isChecked(s.w, s.date)) list("checks").push({ id: uid(), at: s.at || new Date().toISOString(), date: s.date, w: s.w, ...(s.demo ? { demo: true } : {}) });
  });
  save();
}
const hasDemo = () => list("sessions").some(s => s.demo) || list("checks").some(c => c.demo) || list("pt").some(x => x.demo) || list("ptacts").some(x => x.demo);
// Clears everything logged on the selected day (sets, checks, custom entries). Maxes are not touched.
const dayHasData = d => list("sessions").some(x => x.date === d) || list("cali").some(x => x.date === d) || list("checks").some(x => x.date === d) || list("workouts").some(x => x.date === d);
function clearDay() {
  const d = selDate;
  if (!dayHasData(d)) return;
  askConfirm("", "Clear", () => {
    state.data.sessions = list("sessions").filter(x => x.date !== d);
    state.data.checks = list("checks").filter(x => x.date !== d);
    state.data.cali = list("cali").filter(x => x.date !== d);
    state.data.workouts = list("workouts").filter(x => x.date !== d);

}

// A day is "done" for a workout when it has a check (logging sets adds one), or a custom log entry.
function doneByDate() {
  const map = {};
  const add = (d, k) => { if (!d) return; const a = map[d] || (map[d] = []); if (!a.includes(k)) a.push(k); };
  list("checks").forEach(c => add(c.date, c.w));
  CALI.forEach(g => { // a finished calisthenics goal gives that day one yellow dot
    [...new Set(list("cali").filter(x => x.g === g.id).map(x => x.date))].forEach(d => { if (goalDone(g, d)) add(d, "cali"); });
  });
  list("workouts").forEach(e => add(e.date, "custom"));
  const order = [...PLAN.map(p => p.id), "custom", "cali"];
  Object.values(map).forEach(a => a.sort((x, y) => order.indexOf(x) - order.indexOf(y)));
  return map;
}
const shiftMonth = n => { const d = new Date(cal.y, cal.m + n, 1); cal = { y: d.getFullYear(), m: d.getMonth() }; render(); };

}

}

// Chart data: the heaviest weight per day for one exercise within one rep bucket.
const RANGES = [[7, "7 days"], [30, "Month"], [365, "Year"]];
const BUCKETS = [["rm1", "1 rep"], ["rm5", "5 × 5"], ["rm10", "3 × 10"]];
// Opens on the record with the most recent data (a tie goes to 3 x 10, then 5 x 5, then 1 rep).
function lastBucket(ex) {
  let best = "rm1", bestDate = "";
  for (const k of ["rm10", "rm5", "rm1"]) {
    const dates = [...new Set(list("sessions").map(s => s.date))].filter(d => bestFor(k, daySets(ex, d)) > 0).sort();
    const d = dates[dates.length - 1] || "";
    if (d > bestDate) { best = k; bestDate = d; }
  }
  return best;
}
function pointsFor(ex, bucket, start) {
  const dates = [...new Set(list("sessions").filter(s => s.date >= start).map(s => s.date))];
  return dates.map(date => ({ date, v: bestFor(bucket, daySets(ex, date)) })).filter(p => p.v > 0).sort((a, b) => a.date.localeCompare(b.date));
}

function chartSvg(pts, start, end, ref) {
  const W = 320, H = 190, L = 40, R = 22, T = 20, B = 28, iw = W - L - R, ih = H - T - B;
  let lo, hi;
  if (pts.length) {
    const vals = pts.map(p => p.v), mn = Math.min(...vals), mx = Math.max(...vals);
    const pad5 = Math.max(5, (mx - mn) * 0.25);
    lo = Math.floor((mn - pad5) / 5) * 5; hi = Math.ceil((mx + pad5) / 5) * 5;
  } else if (ref) { lo = Math.floor(ref * 0.6 / 5) * 5; hi = Math.ceil(ref * 1.1 / 5) * 5; } // empty chart: scale around your current record
  else { lo = 0; hi = 100; }
  const tm = d => new Date(d + "T00:00:00").getTime();
  const t0 = tm(start), t1 = tm(end), f = n => n.toFixed(1);
  const X = p => L + iw * (tm(p.date) - t0) / (t1 - t0 || 1);
  const Y = v => T + ih * (1 - (v - lo) / (hi - lo));
  const grid = [lo, (lo + hi) / 2, hi].map(v =>
    '<line class="ch-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + f(Y(v)) + '" y2="' + f(Y(v)) + '"/>' +
    '<text class="ch-tx" x="' + (L - 6) + '" y="' + f(Y(v) + 3) + '" text-anchor="end">' + Math.round(v) + '</text>').join("");
  const path = pts.map((p, i) => (i ? "L" : "M") + f(X(p)) + " " + f(Y(p.v))).join(" ");
  const dots = pts.map((p, i) => '<circle class="ch-dot" cx="' + f(X(p)) + '" cy="' + f(Y(p.v)) + '" r="4"><title>' +
    shortDate(p.date) + ": " + p.v + " " + UNIT + '</title></circle>').join("");
  const labels = '<text class="ch-tx" x="' + L + '" y="' + (H - 8) + '">' + shortDate(start) + '</text>' +
    '<text class="ch-tx" x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end">' + shortDate(end) + '</text>';
  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Weight over time">' +
    grid + '<path class="ch-line" d="' + path + '"/>' + dots + labels + "</svg>";
}

function progressModal(m) {
  const n = m.r, now = new Date();

// Latest hold time logged for a weight (up to a date, when given).
function legCur(wt, upTo) {

function legChange(wt) {

  if (r.length < 2) return null;
  let i = r.length - 1;
  while (i > 0 && r[i - 1].s === r[r.length - 1].s) i--;

// A month of made-up knee data so the Physical therapy page has something to show. Training and golf push the next-morning rating up,
// PT and squats pull it down, walking barely matters, and the overall level slowly improves. Removed by "Remove sample data" on Backup.
function ptSeedOnce() {
  if (state.ptSeeded) return;
  state.ptSeeded = 1;
  let seed = 7; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  for (let i = 31; i >= 1; i--) { // activity day = i days ago, morning after = i-1 days ago
    const actDate = daysAgo(i), morn = daysAgo(i - 1), age = 31 - i;
    const a = {}; let eff = 0;
    if ([1, 3].includes(i % 5)) { const m = 30 + 5 * Math.floor(rnd() * 11); a.training = m; eff += 0.8 + 0.02 * m; }
    if (i % 2 === 0) { a.walking = 15 + 5 * Math.floor(rnd() * 9); eff += 0.3; }
    if ([0, 1].includes(i % 3)) { a.pt = 20 + 5 * Math.floor(rnd() * 5); eff -= 1.5; }
    if ([2, 5].includes(i % 7)) { const n = 3 + Math.floor(rnd() * 4); a.squats = n; eff -= 0.5 + 0.2 * n; }
    if ([6, 12, 19, 26].includes(i)) { a.golf = rnd() < 0.5 ? 9 : 18; eff += 0.4 + 0.04 * a.golf; }
    if ([9, 23].includes(i)) a.other = 20;
    const gap = [4, 13, 22].includes(i); // a few forgotten days: nothing logged, not the same as None
    if (!Object.keys(a).length) a.none = null;
    const base = 6.0 - 0.05 * age, noise = (rnd() - 0.5) * 0.8;
    const v = Math.max(0, Math.min(10, base + eff + noise));
    if (!gap && !ptActs(actDate)) state.data.ptacts = [...list("ptacts"), { id: uid(), date: actDate, acts: a, at: new Date().toISOString(), demo: true }];
    if (!ptRec(morn)) state.data.pt = [...list("pt"), { id: uid(), date: morn, l: Math.round(v), r: Math.max(0, Math.min(10, Math.round(v - 0.6 + (rnd() - 0.5) * 2))), at: new Date().toISOString(), demo: true }];
  }
  save();
}
