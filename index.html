<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<script>
"use strict";
// Life Tracker, version 2: workout hub, per-workout pages, calendar.
// ---------- Helpers ----------
const KEY = "lifetracker:v1";
const pad = n => String(n).padStart(2, "0");
const dstr = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => dstr(new Date());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return dstr(d); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const usd = n => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(n);

// Tiny helper to build HTML elements safely: h("div", {class:"x"}, "text", childElement)
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (v != null && v !== false) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}

// ---------- Saved data ----------
// Everything lives in one object: { v: 1, data: { workouts: [...], skills: [...], ... } }
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.data) return s; } catch (e) {}
  return { v: 1, data: {} };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { alert("Could not save. Your browser storage may be full or blocked."); }
}
let state = load();
const list = id => state.data[id] || (state.data[id] = []);

// ---------- The sections ----------
// To add a new section later: copy one block below, change the id, title and fields.
// It then gets its own tab, form, list and backup support automatically
// (no other changes needed).
const STATUS = ["Want to try", "Training", "Achieved"];
const MODULES = [
  {
    id: "workouts", title: "Custom", noun: "custom workout",
    empty: "No custom workouts yet. Add one to log anything outside Workouts 1 to 3.",
    fields: [
      { k: "date", l: "Date", t: "date", def: () => viewDate },
      { k: "name", l: "Workout", t: "text", ph: "Push day", req: 1 },
      { k: "minutes", l: "Minutes", t: "number", min: 0 },
      { k: "notes", l: "Notes", t: "textarea", ph: "Exercises, sets, reps" }
    ],
    head: e => e.name,
    meta: e => [e.date, e.minutes != null && e.minutes + " min"],
    summary: es => { const c = es.filter(e => e.date >= daysAgo(6)).length; return c + (c === 1 ? " custom workout" : " custom workouts") + " in the last 7 days"; }
  },
  {
    id: "rehab", title: "Tendinitis", noun: "rehab log",
    empty: "No rehab logs yet. Add one after each session or check-in.",
    fields: [
      { k: "date", l: "Date", t: "date", def: today },
      { k: "session", l: "Type", t: "select", opts: ["Home exercises", "Physical therapy", "Check-in"] },
      { k: "pain", l: "Pain (0 to 10)", t: "number", min: 0, max: 10 },
      { k: "notes", l: "Exercises and notes", t: "textarea", ph: "What you did, how it felt" }
    ],
    head: e => e.session,
    meta: e => [e.date, e.pain != null && "pain " + e.pain + "/10"],
    summary: es => { const x = es.find(e => e.pain != null); return x ? "Latest pain: " + x.pain + "/10 on " + x.date : "No pain scores logged yet"; }
  }
];
const TABS = [
  { id: "daily", label: "Daily" },
  { id: "workouts", label: "Workouts" },
  { id: "cali", label: "Calisthenics" },
  ...MODULES.filter(m => m.id !== "workouts").map(m => ({ id: m.id, label: m.title })),
  { id: "money", label: "Spending" }
];

// ---------- Screens ----------
let tab = "daily";
const sorted = m => list(m.id).slice().sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.at.localeCompare(a.at));

function addForm(m) {
  const f = h("form");
  m.fields.forEach(fl => {
    let inp;
    if (fl.t === "textarea") inp = h("textarea", { name: fl.k, rows: 3, placeholder: fl.ph });
    else if (fl.t === "select") inp = h("select", { name: fl.k }, fl.opts.map(o => h("option", { value: o }, o)));
    else inp = h("input", { name: fl.k, type: fl.t, placeholder: fl.ph, required: fl.req, min: fl.min, max: fl.max,
      inputmode: fl.t === "number" ? "decimal" : null, step: fl.t === "number" ? "any" : null });
    const def = typeof fl.def === "function" ? fl.def() : fl.def;
    if (def != null) inp.value = def;
    f.append(h("label", {}, h("span", {}, fl.l), inp));
  });
  f.append(h("button", { class: "btn", type: "submit" }, "Save " + m.noun));
  f.addEventListener("submit", ev => {
    ev.preventDefault();
    const e = { id: uid(), at: new Date().toISOString() };
    const fd = new FormData(f);
    m.fields.forEach(fl => {
      const v = (fd.get(fl.k) || "").trim();
      if (v === "") return;
      e[fl.k] = fl.t === "number" ? Number(v) : v;
    });
    list(m.id).unshift(e);
    save(); render();
  });
  return f;
}

function card(m, e) {
  const meta = m.meta(e).filter(Boolean).join(", ");
  return h("div", { class: "card" },
    h("div", { class: "row" },
      h("div", {}, h("div", { class: "t" }, m.head(e)), meta && h("div", { class: "m" }, meta)),
      m.side && h("div", { class: "side" }, m.side(e))),
    e.notes && h("p", { class: "n" }, e.notes),
    h("div", { class: "acts" },
      m.extra ? m.extra(e) : h("span"),
      h("button", { class: "x", onclick: () => {
        askConfirm("Delete this entry?", "Delete", () => { state.data[m.id] = list(m.id).filter(x => x.id !== e.id); save(); render(); });
      } }, "Delete")));
}

function moduleView(m) {
  const es = sorted(m);
  return h("section", {},
    h("h1", {}, m.title),
    h("p", { class: "sum" }, m.summary(es)),
    h("details", { class: "add" }, h("summary", {}, "+ Add " + m.noun), addForm(m)),
    es.length ? es.map(e => card(m, e)) : h("p", { class: "empty" }, m.empty));
}

// ---------- Backup: export and import ----------
async function exportData() {
  const prev = [state.lastExport, state.backupCount];
  state.lastExport = today(); state.backupCount = (state.backupCount || 0) + 1;
  save();
  const name = "life-tracker-backup-" + today() + ".json";
  const file = new File([JSON.stringify(state, null, 2)], name, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); render(); return; }
    catch (e) { if (e.name === "AbortError") { [state.lastExport, state.backupCount] = prev; save(); render(); return; } }
  }
  const a = h("a", { href: URL.createObjectURL(file), download: name });
  document.body.append(a); a.click(); a.remove(); render();
}

// In-app confirm / notice (browser pop-up boxes are blocked in some views). fn = null makes a plain notice.
function askConfirm(text, label, fn, back, no, title) { modal = { type: "confirm", text, label, fn, back, no, title }; render(); }
function confirmModal(m) {
  const go = () => { modal = null; if (m.fn) m.fn(); else render(); };
  return h("div", { class: m.title ? "askc" : "" },
    m.title && h("h3", { class: "askh" }, m.title),
    m.text && h("p", { class: "askt" }, m.text),
    h("div", { class: "askb" },
      m.fn && h("button", { class: "btn alt", onclick: () => { modal = m.back || null; suppressClick = false; renderModal(); } }, m.no || "Cancel"),
      h("button", { class: "btn" + (m.fn && (!m.no || m.title) ? " warn" : ""), onclick: go }, m.label || "OK")));
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const s = JSON.parse(r.result);
      if (!s || typeof s.data !== "object" || Array.isArray(s.data) || !Object.values(s.data).every(v => Array.isArray(v) || (v && typeof v === "object"))) throw new Error("bad");
      askConfirm("This replaces everything on this device with the backup. Continue?", "Restore", () => {
        state = { v: 1, data: s.data, lastExport: s.lastExport, backupCount: s.backupCount, seeded: 1, ptSeeded: 1, ptOct: 1, checkSync: s.checkSync };
        save(); syncChecksOnce(); caliMigrate(); askConfirm("Backup restored.", "OK", null);
      });
    } catch (e) { askConfirm("That file is not a valid Life Tracker backup.", "OK", null); }
  };
  r.readAsText(file);
}

const infoBtn = which => h("button", { class: "infob", "aria-label": "About " + which, onclick: () => { modal = { type: "info", which }; renderModal(); } }, "i");
function backupView() {
  const picker = h("input", { type: "file", accept: "application/json,.json", hidden: true,
    onchange: () => { if (picker.files[0]) importData(picker.files[0]); picker.value = ""; } });
  const row = (title, sub, onclick, extra) => h("button", { class: "srow" + (extra ? " " + extra : ""), onclick },
    h("span", { class: "srt" }, h("b", {}, title), h("small", {}, sub)), h("i", { class: "sch", "aria-hidden": "true" }));
  return h("section", { class: "setpg" },
    h("div", { class: "hhead" }, h("button", { class: "lnk sback", "aria-label": "Back to Daily", onclick: () => goTab("daily", () => { selDate = viewDate = today(); }) }, "‹"), h("h1", {}, "Settings"), h("span", { class: "sback" })),
    h("div", { class: "sstats" },
      h("div", {}, h("span", {}, "Backups"), h("b", {}, String(state.backupCount || 0))),
      h("div", {}, h("span", {}, "Last backup"), h("b", {}, state.lastExport ? longDate(state.lastExport) : "None yet"))),
    h("div", { class: "scap" }, "Backup"),
    h("div", { class: "sgrp" },
      row("Export backup", "Save all your data as a file", exportData),
      row("Import backup", "Restore from a file (replaces current data)", () => picker.click()),
      hasDemo() && row("Remove sample data", "Delete the example entries", removeDemo)),
    h("p", { class: "snote" }, "Your data lives only on this phone. Export now and then so you always have a copy.", infoBtn("export")),
    h("div", { class: "sbot" }, h("div", { class: "sgrp" }, row("Clear all data", "Erase every entry on every page", clearAll, "danger"))),
    picker);
}

// Edit names and exercises here. Keep each id the same so saved data stays linked.

  { id: "w2", name: "Workout 2", color: "var(--c2)", sym: "lat", dogs: ["lats", "back", "biceps"], ex: [["lat", "Lat pulldown"], ["row", "Seated row"], ["biceps", "Biceps curl"]] },

];

// Three records per exercise. Saved keys stay rm1 / rm5 / rm10 so old data keeps working:
//   rm1  = heaviest weight you have lifted at any rep count (4 reps at a weight above your 1 rep max raises it too)
//   rm5  = heaviest weight you got 5 sets of 5+ reps with in one day (5 x 5)
//   rm10 = heaviest weight you got 3 sets of 10+ reps with in one day (3 x 10)
//   rm4  = heaviest weight you got 4 sets of 10+ reps with in one day (4 x 10)
// Each record stands on its own: it only changes when you type it in. Nothing changes another one.
const GROUPS = { rm1: [1, 0, 99], rm5: [5, 4, 7], rm10: [3, 10, 99], rm4: [4, 10, 99] }; // [sets needed, min reps, max reps]
const MARK_LBL = { rm1: "1 rep max", rm10: "3 × 10", rm4: "4 × 10", rm5: "5 × 5" };
// Bench and squats show all four records; every other exercise shows 3 × 10 and 4 × 10.
const marksOf = ex => (ex === "bench" || ex === "squat" ? ["rm4", "rm10", "rm5", "rm1"] : ["rm4", "rm10"]).map(k => [k, MARK_LBL[k]]);
// Best result for one record from a list of sets: the weight you reached at least `n` times within the rep range.
function bestFor(k, sets) {
  const [n, lo, hi] = GROUPS[k];
  const w = sets.filter(x => x.weight && (x.reps || 1) >= lo && (x.reps || 1) <= hi).map(x => x.weight).sort((a, b) => b - a);
  return w.length >= n ? w[n - 1] : 0;
}

// A day is "done" for a workout when it has a check (logging sets adds one), or a custom log entry.
function doneByDate() {

  const add = (d, k) => { if (!d) return; const a = map[d] || (map[d] = []); if (!a.includes(k)) a.push(k); };
  list("checks").forEach(c => add(c.date, c.w));

  list("workouts").forEach(e => add(e.date, "custom"));
  const order = [...PLAN.map(p => p.id), "custom", "cali"];
  Object.values(map).forEach(a => a.sort((x, y) => order.indexOf(x) - order.indexOf(y)));

}

function recPlan(t) {

// Chart data: the heaviest weight per day for one exercise within one rep bucket.
const RANGES = [[7, "7 days"], [30, "Month"], [365, "Year"]];
const BUCKET_LBL = { rm1: "1 rep", rm10: "3 × 10", rm4: "4 × 10", rm5: "5 × 5" };
const bucketsOf = ex => marksOf(ex).map(([k]) => [k, BUCKET_LBL[k]]);
// Opens on the record with the most recent data (a tie goes to 3 x 10, then 5 x 5, then 1 rep).
function lastBucket(ex) {
  let best = marksOf(ex)[0][0], bestDate = "";
  for (const k of marksOf(ex).map(x => x[0]).reverse()) {
    const dates = [...new Set(list("sessions").map(s => s.date))].filter(d => bestFor(k, daySets(ex, d)) > 0).sort();
    const d = dates[dates.length - 1] || "";
    if (d > bestDate) { best = k; bestDate = d; }
  }
  return best;
}
function pointsFor(ex, bucket, start) {
  const dates = [...new Set(list("sessions").filter(s => s.date >= start).map(s => s.date))];
  return dates.map(date => ({ date, v: bestFor(bucket, daySets(ex, date)) })).filter(p => p.v > 0).sort((a, b) => a.date.localeCompare(b.date));
}

function chartSvg(pts, start, end, ref, sel) {
  const W = 320, H = 190, L = 40, R = 22, T = 20, B = 28, iw = W - L - R, ih = H - T - B;
  let lo, hi;
  if (pts.length) {
    const vals = pts.map(p => p.v), mn = Math.min(...vals), mx = Math.max(...vals);
    const pad5 = Math.max(5, (mx - mn) * 0.25);
    lo = Math.floor((mn - pad5) / 5) * 5; hi = Math.ceil((mx + pad5) / 5) * 5;
  } else if (ref) { lo = Math.floor(ref * 0.6 / 5) * 5; hi = Math.ceil(ref * 1.1 / 5) * 5; } // empty chart: scale around your current record
  else { lo = 0; hi = 100; }
  const tm = d => new Date(d + "T00:00:00").getTime();
  const t0 = tm(start), t1 = tm(end), f = n => n.toFixed(1);
  const X = p => L + iw * (tm(p.date) - t0) / (t1 - t0 || 1);
  const Y = v => T + ih * (1 - (v - lo) / (hi - lo));
  const grid = [lo, (lo + hi) / 2, hi].map(v =>
    '<line class="ch-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + f(Y(v)) + '" y2="' + f(Y(v)) + '"/>' +
    '<text class="ch-tx" x="' + (L - 6) + '" y="' + f(Y(v) + 3) + '" text-anchor="end">' + Math.round(v) + '</text>').join("");
  const path = pts.map((p, i) => (i ? "L" : "M") + f(X(p)) + " " + f(Y(p.v))).join(" ");
  const dots = pts.map((p, i) => (sel === p.date ? '<circle class="ch-ring" cx="' + f(X(p)) + '" cy="' + f(Y(p.v)) + '" r="9"/>' : "") +
    '<circle class="ch-dot" cx="' + f(X(p)) + '" cy="' + f(Y(p.v)) + '" r="' + (sel === p.date ? 5.5 : 4) + '"><title>' +
    shortDate(p.date) + ": " + p.v + " " + UNIT + '</title></circle>' +
    '<circle class="ch-hit" data-d="' + p.date + '" cx="' + f(X(p)) + '" cy="' + f(Y(p.v)) + '" r="15"/>').join("");
  const labels = '<text class="ch-tx" x="' + L + '" y="' + (H - 8) + '">' + shortDate(start) + '</text>' +
    '<text class="ch-tx" x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end">' + shortDate(end) + '</text>';
  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Weight over time">' +
    grid + '<path class="ch-line" d="' + path + '"/>' + dots + labels + "</svg>";
}

// Remove one chart entry: that day's sets of this exercise at that weight (within the chosen rep group), then work the records out again.
function delPoint(ex, bucket, date, v) {
  const [, lo, hi] = GROUPS[bucket];
  list("sessions").filter(s => s.date === date).forEach(s => { s.sets = s.sets.filter(x => !(x.ex === ex && x.weight === v && (x.reps || 1) >= lo && (x.reps || 1) <= hi)); });
  state.data.sessions = list("sessions").filter(s => s.sets.length);
}

// ---------- Physical therapy (knee tracker) ----------
// Raw data, kept separate so nothing can be mixed up and everything can be recalculated:

// A rating on morning D is connected to the activities of day D-1. Nothing else links them.
const ACTS = [
  { k: "training", label: "Training", unit: "min" }, { k: "golf", label: "Golf", unit: "holes" }, { k: "walking", label: "Walking", unit: "min" },

// Old versions stored "what I did the day before" on the rating itself. Move it onto the day it belongs to.

  list("pt").forEach(r => {

    if (r.did.includes("nopt") && !ks.length) ks.push("none");
    if (ks.length) { const y = ptPrev(r.date); let a = ptActs(y); if (!a) { a = { id: uid(), date: y, acts: {}, at: r.at || "" }; state.data.ptacts = [...list("ptacts"), a]; } ks.forEach(k => { if (!(k in a.acts)) a.acts[k] = null; }); }

const legLog = () => state.data.legh || (state.data.legh = []);
// Latest hold time logged for a weight (up to a date, when given).
function legCur(wt, upTo) {
  const r = legLog().filter(e => e.w === wt && (!upTo || e.date <= upTo)).sort((x, y) => x.date.localeCompare(y.date) || (x.at || "").localeCompare(y.at || ""));
  return r.length ? r[r.length - 1].s : null;
}
// Did the hold time at this weight go up or down? Compares the latest value with the last different one before it.
function legChange(wt) {
  const r = legLog().filter(e => e.w === wt && e.s != null).sort((x, y) => x.date.localeCompare(y.date) || (x.at || "").localeCompare(y.at || ""));
  if (r.length < 2) return null;
  let i = r.length - 1;
  while (i > 0 && r[i - 1].s === r[r.length - 1].s) i--;
  if (i === 0) return null;
  return { from: r[i - 1].s, to: r[r.length - 1].s, date: r[i].date };
}
function legSet(wt, sec) { // sec = null clears the weight
  if (legCur(wt) === sec) sec = null; // tapping the selected time again takes it off (shows nothing)
  legLog().push({ id: uid(), at: new Date().toISOString(), date: today(), w: wt, s: sec }); // every change is kept, so the arrow shows right away
  save();
}
const legFmt = n => Math.floor(n / 60) + ":" + pad(n % 60);

function amtPickModal() {

function legModal() {

    delete state.data.legt; save();
  }
  const rows = LEG_WEIGHTS.map(wt => {
    const btns = LEG_OPTS.map(([sec, lbl]) => h("button", { type: "button", "aria-label": wt + " pounds, " + lbl }, lbl));
    const paint = () => { const c = legCur(wt); btns.forEach((b, i) => { const on = LEG_OPTS[i][0] === c; b.className = "lgc" + (on ? " on" : ""); b.setAttribute("aria-pressed", String(on)); }); };
    const note = h("div", { class: "lgn" });
    const paintNote = () => { const c = legChange(wt); note.className = "lgn" + (c ? (c.to > c.from ? " up" : " dn") : ""); note.textContent = c ? (c.to > c.from ? "▲ " : "▼ ") + shortDate(c.date) : ""; };

    const clr = h("button", { type: "button", class: "lgx", "aria-label": wt + " pounds: remove arrow and date", onclick: () => {
      const mine = legLog().filter(e => e.w === wt && e.s != null).sort((x, y) => x.date.localeCompare(y.date) || (x.at || "").localeCompare(y.at || ""));

    } }, raw(TRASH));
    const paintAll = () => { paint(); paintNote(); clr.style.display = legChange(wt) ? "" : "none"; };
    btns.forEach((b, i) => { b.onclick = () => { legSet(wt, LEG_OPTS[i][0]); paintAll(); }; });
    paintAll();
    return h("div", { class: "lgr" }, h("b", {}, wt + " " + UNIT), h("div", {}, h("div", { class: "lgcs" }, btns), h("div", { class: "lgf" }, note, clr)));
